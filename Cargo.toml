[package]
name = "neupm"
version = "0.1.0"
edition = "2024"
authors = ["NEUPM Contributors"]
description = "NEUPM - Next-Generation Native Package Manager"
readme = "README.md"
license = "MIT OR Apache-2.0"

[lib]
name = "neupm"
path = "src/lib.rs"

[[bin]]
name = "neupm"
path = "src/main.rs"

[features]
default = []
experimental = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
